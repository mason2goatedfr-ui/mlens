
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mLens</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
      background: #101014;
      color: #f5f5f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #252039 0%, #101014 55%);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    header { margin-bottom: 22px; }

    h1 {
      margin: 0 0 5px;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .subtitle, .hint {
      color: #aaa7b7;
      font-size: 13px;
    }

    .panel {
      background: #191920;
      border: 1px solid #35333e;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 35px #0004;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 650;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #41404c;
      border-radius: 10px;
      outline: none;
      background: #101015;
      color: #fff;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #b39aff;
      box-shadow: 0 0 0 2px #a78bfa22;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #b39aff;
      color: #171222;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin: 14px 0 8px;
      color: #c7b9ff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #answer {
      min-height: 90px;
      padding: 15px;
      border: 1px solid #35333e;
      border-radius: 10px;
      background: #101015;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .footer {
      margin-top: 12px;
      color: #92909e;
      font-size: 12px;
      line-height: 1.5;
    }

    .hidden { display: none; }

    body.embed {
      padding: 14px;
      background: #101014;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>✦ mLens</h1>
      <div class="subtitle">Local browser AI · No API key</div>
    </header>

    <section class="panel">
      <label for="question">Ask mLens</label>

      <textarea
        id="question"
        placeholder="Paste a passage, ask a question, or enter a math problem..."
      ></textarea>

      <button id="ask" type="button">Ask mLens</button>

      <div id="status" role="status" aria-live="polite">
        Ready. The AI model loads when you first ask a question.
      </div>

      <div id="answer" aria-live="polite">Your answer will appear here.</div>

      <div class="footer">
        AI responses can be wrong. Check important answers.
        The first model download may take a while.
      </div>
    </section>
  </main>

  <script type="module">
    const questionBox = document.querySelector("#question");
    const askButton = document.querySelector("#ask");
    const statusBox = document.querySelector("#status");
    const answerBox = document.querySelector("#answer");

    if (new URLSearchParams(location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    let generatorPromise = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getMathExpression(text) {
      const normalized = text
        .replace(/,/g, "")
        .replace(/[×✕]/g, "*")
        .replace(/[÷]/g, "/")
        .replace(/\bplus\b/gi, "+")
        .replace(/\bminus\b/gi, "-")
        .replace(/\btimes\b/gi, "*")
        .replace(/\bdivided by\b/gi, "/")
        .replace(/\bmultiplied by\b/gi, "*")
        .replace(/\bto the power of\b/gi, "**");

      const asksForMath =
        /\b(calculate|compute|evaluate|solve|what is|how much is)\b/i.test(text);

      const hasOperator = /[+\-*/^]/.test(normalized);

      if (!hasOperator || (!asksForMath && !/^\s*[\d().+\-*/\s^]+\s*$/.test(normalized))) {
        return null;
      }

      const match = normalized.match(
        /[\d.()]+\s*(?:\*\*|[+\-*/^])\s*[\d.()]+(?:\s*(?:\*\*|[+\-*/^])\s*[\d.()]+)*/ 
      );

      if (!match) return null;

      const expression = match[0].trim();

      if (!/^[\d\s().+\-*/^]+$/.test(expression)) return null;

      return expression;
    }

    function calculate(expression) {
      const safeExpression = expression.replace(/\^/g, "**");

      if (!/^[\d\s().+\-*/]+$/.test(safeExpression)) {
        throw new Error("Unsupported math expression.");
      }

      // Only evaluate expressions containing numbers and arithmetic operators.
      const result = Function(
        '"use strict"; return (' + safeExpression + ')'
      )();

      if (typeof result !== "number" || !Number.isFinite(result)) {
        throw new Error("That calculation has no finite result.");
      }

      return Number.isInteger(result)
        ? String(result)
        : String(Number(result.toPrecision(12)));
    }

    async function getModel() {
      if (!generatorPromise) {
        generatorPromise = (async () => {
          setStatus("Downloading AI engine...");

          const { pipeline } = await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2"
          );

          setStatus("Loading SmolLM2 AI model...");

          return await pipeline(
            "text-generation",
            "HuggingFaceTB/SmolLM2-135M-Instruct",
            {
              dtype: "q4",
              progress_callback: (progress) => {
                if (progress.status === "progress") {
                  const percent = Math.round(progress.progress || 0);
                  setStatus(
                    `Downloading model files: ${percent}%`
                  );
                } else if (progress.status === "done") {
                  setStatus("Model file ready.");
                }
              }
            }
          );
        })().catch((error) => {
          generatorPromise = null;
          throw error;
        });
      }

      return generatorPromise;
    }

    function extractAnswer(generated, originalQuestion) {
      let answer = "";

      if (Array.isArray(generated)) {
        // Chat pipelines can return the entire conversation.
        const lastAssistant = [...generated]
          .reverse()
          .find((message) =>
            message?.role === "assistant" &&
            typeof message.content === "string"
          );

        answer = lastAssistant?.content || "";
      } else if (typeof generated === "string") {
        answer = generated;

        // Remove an echoed question when the pipeline returns the prompt too.
        const questionIndex = answer.lastIndexOf(originalQuestion);

        if (questionIndex !== -1) {
          answer = answer.slice(
            questionIndex + originalQuestion.length
          );
        }
      }

      return answer
        .replace(/<\|im_end\|>/g, "")
        .replace(/<\|endoftext\|>/g, "")
        .replace(/<\|assistant\|>/g, "")
        .replace(/<\|[^|]+\|>/g, "")
        .trim();
    }

    async function ask() {
      const question = questionBox.value.trim();

      if (!question) {
        setStatus("Enter a question first.");
        questionBox.focus();
        return;
      }

      askButton.disabled = true;
      answerBox.textContent = "";
      
      try {
        const expression = getMathExpression(question);

        if (expression) {
          try {
            answerBox.textContent = calculate(expression);
            setStatus("Calculated locally.");
            return;
          } catch {
            // If parsing fails, let the AI try to explain the problem.
          }
        }

        setStatus("Preparing your question...");

        const model = await getModel();

        setStatus("Thinking...");

        const messages = [
          {
            role: "system",
            content:
              "You are mLens, a helpful and accurate study assistant. " +
              "Answer the user's actual question directly. " +
              "If the user provides a passage, use evidence from that passage. " +
              "Do not merely repeat or summarize the passage when asked a question. " +
              "If asked why something happened, explain the reason. " +
              "If information is missing, say so instead of inventing facts. " +
              "Use a short, clear answer unless the user asks for more detail."
          },
          {
            role: "user",
            content: question
          }
        ];

        const result = await model(messages, {
          max_new_tokens: 120,
          do_sample: false,
          return_full_text: false
        });

        const generated = result?.[0]?.generated_text;
        const answer = extractAnswer(generated, question);

        if (!answer) {
          answerBox.textContent =
            "The model did not return a readable answer. Try asking again.";
          setStatus("No readable answer was generated.");
        } else {
          answerBox.textContent = answer;
          setStatus("Finished. Verify important answers.");
        }
      } catch (error) {
        console.error("mLens error:", error);

        answerBox.textContent =
          "mLens couldn't complete the request. Check your connection and try again.";

        setStatus(
          "Error: " + (error?.message || "Unknown error")
        );
      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener("click", ask);

    questionBox.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        ask();
      }
    });
  </script>
</body>
</html>
