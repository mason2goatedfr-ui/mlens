<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ mLens AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d0d11;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #14131a;
      border: 1px solid #71658e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      height: 44px;
      background: #29223d;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      font-size: 15px;
      color: #ffffff;
      border-bottom: 1px solid #3d3554;
    }
    .body-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-weight: bold;
      font-size: 11px;
      color: #aaa7b7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0a0a0e;
      border: 1px solid #3c3848;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #b39aff;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    #ask-btn {
      background: #b39aff;
      color: #171222;
      width: 100%;
    }
    #status {
      font-size: 12px;
      color: #c7b9ff;
      min-height: 16px;
    }
    #ans {
      min-height: 80px;
      padding: 12px;
      border: 1px solid #373441;
      border-radius: 8px;
      background: #0a0a0e;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .sub-btn {
      flex: 1;
      background: #2a2538;
      color: #f5f5f7;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">✦ mLens AI</div>
  <div class="body-content">
    <div>
      <label>Hugging Face API Token</label>
      <input type="password" id="mlens-key" placeholder="Paste your HF token here">
    </div>
    <div>
      <label>Ask mLens</label>
      <textarea id="mlens-q" placeholder="Paste your question, math problem, or text here..."></textarea>
    </div>
    <button id="ask-btn">Ask mLens</button>
    <div id="status">Ready.</div>
    <div id="ans">Your answer will appear here.</div>
    <div class="btn-row">
      <button class="sub-btn" id="clear-btn">Clear</button>
      <button class="sub-btn" id="copy-btn">Copy Answer</button>
    </div>
  </div>
</div>

<script>
  const keyInput = document.getElementById('mlens-key');
  const qInput = document.getElementById('mlens-q');
  const askBtn = document.getElementById('ask-btn');
  const statusDiv = document.getElementById('status');
  const ansDiv = document.getElementById('ans');
  const clearBtn = document.getElementById('clear-btn');
  const copyBtn = document.getElementById('copy-btn');

  askBtn.onclick = async () => {
    const token = keyInput.value.trim();
    const query = qInput.value.trim();
    
    if(!token) { statusDiv.textContent = "Please enter your HF API token."; return; }
    if(!query) { statusDiv.textContent = "Please enter a question or text."; return; }

    askBtn.disabled = true;
    askBtn.textContent = "Thinking...";
    statusDiv.textContent = "Contacting AI server...";
    ansDiv.textContent = "";

    try {
      const targetUrl = "https://api-inference.huggingface.co/v1/chat/completions";
      const proxyUrl = "https://corsproxy.io/?url=" + encodeURIComponent(targetUrl);

      const response = await fetch(proxyUrl, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "HuggingFaceTB/SmolLM2-1.7B-Instruct",
          messages: [
            { role: "system", content: "Answer directly and concisely using only facts supported by the user query." },
            { role: "user", content: query }
          ],
          max_tokens: 120,
          temperature: 0.1
        })
      });

      const data = await response.json();
      if(!response.ok) {
        throw new Error(data.error?.message || `HTTP Error ${response.status}`);
      }

      const answer = data.choices?.[0]?.message?.content?.trim() || "No response returned.";
      ansDiv.textContent = answer;
      statusDiv.textContent = "Done.";
    } catch (err) {
      ansDiv.textContent = "Error: " + err.message;
      statusDiv.textContent = "Failed.";
    } finally {
      askBtn.disabled = false;
      askBtn.textContent = "Ask mLens";
    }
  };

  clearBtn.onclick = () => {
    qInput.value = "";
    ansDiv.textContent = "Your answer will appear here.";
    statusDiv.textContent = "Ready.";
  };

  copyBtn.onclick = async () => {
    if (ansDiv.textContent) {
      await navigator.clipboard.writeText(ansDiv.textContent);
      statusDiv.textContent = "Copied to clipboard!";
    }
  };
</script>

</body>
</html>
