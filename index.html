
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mLens AI</title>
<style>
body{margin:0;background:#101116;color:#f5f5f7;font:16px system-ui;display:grid;place-items:center;min-height:100vh}
main{width:min(560px,90vw);background:#1b1c24;padding:24px;border-radius:18px;box-sizing:border-box}
h1{margin-top:0}p{color:#b9bac8}
textarea{box-sizing:border-box;width:100%;height:110px;background:#101116;color:white;border:1px solid #444;padding:12px;border-radius:10px;font:inherit}
button{width:100%;padding:12px;margin-top:10px;background:#9b7bff;color:#111;border:0;border-radius:10px;font-weight:700;cursor:pointer}
#status,#answer{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>✦ mLens</h1>
<p>Local AI assistant. No API key required.</p>
<textarea id="question" placeholder="Ask mLens something..."></textarea>
<button id="ask">Load AI & Ask</button>
<div id="status">Ready.</div>
<div id="answer"></div>
</main>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';

const status = document.querySelector('#status');
const answer = document.querySelector('#answer');
const button = document.querySelector('#ask');
let model;

button.addEventListener('click', async () => {
  const question = document.querySelector('#question').value.trim();
  if (!question) {
    status.textContent = 'Type a question first.';
    return;
  }

  button.disabled = true;
  answer.textContent = '';

  try {
    if (!model) {
      status.textContent = 'Loading AI library and downloading model. First load may take a while...';
      model = await pipeline(
        'text-generation',
        'HuggingFaceTB/SmolLM2-135M-Instruct',
        { dtype: 'q4' }
      );
    }

    status.textContent = 'Thinking...';
    const result = await model(
      [
        { role: 'system', content: 'You are mLens, a helpful assistant. Answer clearly and accurately.' },
        { role: 'user', content: question }
      ],
      { max_new_tokens: 120, do_sample: false }
    );

    const generated = result[0].generated_text;
    answer.textContent = Array.isArray(generated)
      ? generated[generated.length - 1]?.content ?? JSON.stringify(generated)
      : String(generated);
    status.textContent = 'Done.';
  } catch (error) {
    status.textContent = 'Error: ' + (error.message || String(error));
    console.error(error);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
