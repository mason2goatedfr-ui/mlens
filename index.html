
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mLens</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101014;
      color: #f5f5f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: radial-gradient(ellipse at top, #29223d, #101014 65%);
      min-height: 100vh;
    }

    body.embed {
      padding: 12px;
      background: #101014;
    }

    main {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }

    .subtitle, .footer {
      color: #aaa7b7;
      font-size: 12px;
    }

    .panel {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #373441;
      border-radius: 15px;
      background: #191920;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 9px;
    }

    textarea {
      width: 100%;
      min-height: 145px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #44414e;
      border-radius: 10px;
      background: #101015;
      color: white;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 2px solid #a78bfa;
      outline-offset: 1px;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    #ask {
      width: 100%;
      margin-top: 10px;
      background: #b39aff;
      color: #171222;
    }

    #ask:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      min-height: 20px;
      margin: 14px 0 8px;
      color: #c7b9ff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #answer {
      min-height: 85px;
      padding: 13px;
      border: 1px solid #373441;
      border-radius: 10px;
      background: #101015;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .actions button {
      flex: 1;
      background: #302b3d;
      color: white;
    }

    .footer {
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>✦ mLens</h1>
      <div class="subtitle">Browser AI · No API key</div>
    </header>

    <section class="panel">
      <label for="question">Ask mLens</label>

      <textarea
        id="question"
        placeholder="Paste your passage and question here..."
      ></textarea>

      <button id="ask">Ask mLens</button>

      <div id="status" role="status" aria-live="polite">
        Ready. The model loads on your first question.
      </div>

      <div id="answer" aria-live="polite">
        Your answer will appear here.
      </div>

      <div class="actions">
        <button id="clear" type="button">New question</button>
        <button id="copy" type="button">Copy answer</button>
      </div>

      <div class="footer">
        The model stays loaded while this page remains open.
        Model files can be cached in your browser. Answers may be incorrect.
      </div>
    </section>
  </main>

  <script type="module">
    const questionBox = document.querySelector("#question");
    const askButton = document.querySelector("#ask");
    const clearButton = document.querySelector("#clear");
    const copyButton = document.querySelector("#copy");
    const statusBox = document.querySelector("#status");
    const answerBox = document.querySelector("#answer");

    if (new URLSearchParams(location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    // Shared for every question in this page session.
    // Do not create a new pipeline inside ask().
    let modelPromise = null;
    let busy = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function getModel() {
      if (modelPromise) {
        return modelPromise;
      }

      modelPromise = (async () => {
        setStatus("Loading AI engine...");

        const { env, pipeline } = await import(
          "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2"
        );

        // Cache downloaded model files in the browser when supported.
        env.useBrowserCache = true;

        setStatus("Loading the AI model for the first time...");

        return await pipeline(
          "text-generation",
          "HuggingFaceTB/SmolLM2-135M-Instruct",
          {
            dtype: "q4",
            progress_callback: (progress) => {
              if (progress.status === "progress") {
                const percent = Math.round(progress.progress || 0);
                setStatus(`Preparing model files: ${percent}%`);
              }
            }
          }
        );
      })().catch((error) => {
        // Allow a retry if loading fails.
        modelPromise = null;
        throw error;
      });

      return modelPromise;
    }

    function extractAnswer(generated, question) {
      let answer = "";

      if (Array.isArray(generated)) {
        const lastAssistant = [...generated]
          .reverse()
          .find((message) =>
            message?.role === "assistant" &&
            typeof message.content === "string"
          );

        answer = lastAssistant?.content || "";
      } else if (typeof generated === "string") {
        answer = generated.trim();

        const index = answer.lastIndexOf(question);

        if (index !== -1) {
          answer = answer.slice(index + question.length).trim();
        }
      }

      return answer
        .replace(/<\|[^|]+\|>/g, "")
        .trim();
    }

    async function ask() {
      if (busy) return;

      const question = questionBox.value.trim();

      if (!question) {
        setStatus("Enter a passage or question first.");
        questionBox.focus();
        return;
      }

      busy = true;
      askButton.disabled = true;
      askButton.textContent = "Working...";
      answerBox.textContent = "";

      try {
        const model = await getModel();

        setStatus("Thinking...");

        const messages = [
          {
            role: "system",
            content:
              "You are mLens, a reading comprehension assistant. " +
              "Answer the actual question using the supplied passage. " +
              "Use only details supported by the passage. " +
              "Do not invent events, dates, or motives. " +
              "Answer directly in one or two clear sentences. " +
              "If the passage does not contain the answer, say so."
          },
          {
            role: "user",
            content: question
          }
        ];

        const result = await model(messages, {
          max_new_tokens: 100,
          do_sample: false
        });

        const generated = result?.[0]?.generated_text;
        const answer = extractAnswer(generated, question);

        if (answer) {
          answerBox.textContent = answer;
          setStatus("Finished. Ready for another question.");
        } else {
          answerBox.textContent =
            "No readable answer was generated. Try rephrasing the question.";
          setStatus("No answer returned.");
        }
      } catch (error) {
        console.error("mLens error:", error);

        answerBox.textContent =
          "Something went wrong. Check your connection and try again.";

        setStatus("Error: " + (error.message || "Unknown error"));
      } finally {
        busy = false;
        askButton.disabled = false;
        askButton.textContent = "Ask mLens";
      }
    }

    askButton.addEventListener("click", ask);

    questionBox.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        ask();
      }
    });

    clearButton.addEventListener("click", () => {
      if (busy) return;

      questionBox.value = "";
      answerBox.textContent = "Your next answer will appear here.";
      setStatus(
        modelPromise
          ? "Model is ready. Ask your next question."
          : "Ready. The model loads on your first question."
      );

      questionBox.focus();
    });

    copyButton.addEventListener("click", async () => {
      const answer = answerBox.textContent.trim();

      if (!answer || answer === "Your answer will appear here.") {
        setStatus("There is no answer to copy yet.");
        return;
      }

      try {
        await navigator.clipboard.writeText(answer);
        setStatus("Answer copied.");
      } catch {
        setStatus("Copy was blocked by the browser.");
      }
    });
  </script>
</body>
</html>
